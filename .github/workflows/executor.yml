name: AgentPay executor
on:
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'
permissions:
  contents: read
concurrency:
  group: agentpay-aevum-executor
  cancel-in-progress: false
jobs:
  execute:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: agentpay-testnet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - name: Reconcile and execute bounded requests
        run: npm run worker
        env:
          AGENTPAY_MODE: live
          AGENTPAY_WORKER_BATCH: '4'
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          AGENTPAY_DATABASE: ${{ vars.AGENTPAY_DATABASE }}
          AEVUM_RPC_URL: https://rpc-test.qday.info
          AEVUM_EXECUTOR_ADDRESS: ${{ vars.AEVUM_EXECUTOR_ADDRESS }}
          AEVUM_EXECUTOR_PRIVATE_KEY: ${{ secrets.AEVUM_EXECUTOR_PRIVATE_KEY }}
          GENLAYER_NETWORK: studio-dev
          GENLAYER_CONTRACT_ADDRESS: ${{ vars.GENLAYER_CONTRACT_ADDRESS }}
          GENLAYER_OPERATOR_PRIVATE_KEY: ${{ secrets.GENLAYER_OPERATOR_PRIVATE_KEY }}
